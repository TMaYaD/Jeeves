version: "3.9"

# Local development stack:
#   postgres   — primary datastore (the op log and the server-owned tables)
#   backend    — FastAPI service
#   redis      — auth nonce/rate-limit counters, escrow and member-auth state

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeeves
      POSTGRES_PASSWORD: jeeves
      POSTGRES_DB: jeeves
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    # Connection logging only.  Nothing streams the WAL any more, so the
    # logical-replication settings this override also used to carry are gone.
    # A `postgres_data` volume that predates #556 still holds the orphaned
    # `powersync` slot, and Postgres refuses to start on the default `wal_level`
    # while a logical slot exists (FATAL: logical replication slot 'powersync'
    # exists, but 'wal_level' < 'logical').  Drop it once — see
    # README.md#one-time-powersync-replication-slot-cleanup.
    command: >
      postgres
        -c log_connections=on
        -c log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeeves -d jeeves"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql+asyncpg://jeeves:jeeves@postgres:5432/jeeves"
      REDIS_URL: "redis://redis:6379/0"
      # Signs access tokens.  The insecure default is what makes the dev stack
      # start with no shell setup; override it in the shell before `compose up`
      # if you need a real one:  export SECRET_KEY="my-real-secret"
      SECRET_KEY: "${SECRET_KEY:-insecure-dev-key}"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    # app.migrate wraps `alembic upgrade head` with schema/version drift
    # detection — see infra/README.md "Recovering from schema/version drift".
    command: sh -c "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
