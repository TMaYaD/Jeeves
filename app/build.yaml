# Drift code-generator configuration.
#
# `store_date_time_values_as_text: true` is load-bearing rather than stylistic.
# The op log encodes instants as ISO-8601 UTC text (`sync/collection_codecs.dart`,
# `FieldKind.instant`), and this schema backs a store holding both rows the
# projector writes from those ops and rows the DAOs write locally — so the two
# paths have to spell a timestamp the same way. Drift's default (epoch int) would
# make a projected row and a locally authored one incomparable.
targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: true
