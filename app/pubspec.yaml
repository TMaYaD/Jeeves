name: jeeves
description: A productivity-focused todos app for mobile, web, and desktop.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.11.0 <4.0.0"
  # Pinned exactly so Dependabot's pub helper (which picks the newest Flutter
  # release matching this constraint) downloads the same Flutter we use
  # locally and in CI — eliminating pubspec.lock drift caused by
  # SDK-vendored packages (meta, analyzer, dart_style, …).
  # Each Flutter release ships exactly one Dart SDK, so pinning Flutter alone
  # fully determines the resolution. Keep in sync with .fvmrc.
  flutter: "3.44.1"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  meta: ^1.17.0

  # Local storage (offline-first)
  drift: ^2.34.3
  # Bridges Drift to a sqlite_async connection, which is what the domain store
  # (`database/domain_store_io.dart`) is opened over: one shared connection with
  # a proper write lock, and an update stream that names the tables a write
  # touched so live queries refresh.
  drift_sqlite_async: ^0.3.1
  # Imported directly for `SqliteDatabase` in the domain store's open path.
  sqlite_async: ^0.14.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0

  # HTTP / API
  dio: ^5.11.0
  retrofit: ^4.10.0
  # The op-log sync stack's realtime signal socket (dio does not speak
  # WebSocket).
  web_socket_channel: ^3.0.3

  # Notifications
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  # firebase_messaging: ^16.1.3   # Uncomment when Firebase is configured
  # firebase_core: ^4.6.0         # Uncomment when Firebase is configured

  # Location
  # Held at 14.0.2: geolocator 14.0.3 pulls package_info_plus 10 -> win32 ^6,
  # which conflicts with file_picker 11.x (win32 ^5.9). Unblocks once we move
  # to file_picker 12 stable. See .github/dependabot.yml.
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Voice / Speech
  speech_to_text: ^7.4.0

  # AI / NLP helpers
  # (calls backend AI endpoint via api_service)

  # Navigation
  go_router: ^17.5.0

  # Local key-value persistence (planning ritual state)
  shared_preferences: ^2.3.3

  # File import
  # Pinned to the 11.x stable line: file_picker 12.x is still pre-release and
  # deprecates `withData`/`bytes` (used in screens/import_screen.dart), which
  # `flutter analyze` treats as fatal infos. See the Dependabot ignore rule in
  # .github/dependabot.yml — it lets 12.0.0 through once it ships stable.
  file_picker: ^12.0.0

  # Encrypted token storage (JWT)
  flutter_secure_storage: ^10.3.1

  # Brand / SVG
  flutter_svg: ^2.3.0

  # Utilities
  # `DeepCollectionEquality` for op-payload field values, which are arbitrarily
  # nested decoded JSON — so `FieldWrite ==` has to recurse. Imported directly by
  # lib/sync/, and already in the graph under flutter, so declaring it adds no
  # resolution risk and only makes the import honest.
  collection: ^1.19.0
  uuid: ^4.6.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.0

  # Minimal Sync Server envelope signing (lib/sync/): Ed25519 over the v1 op
  # envelope. Pure Dart, so `flutter test` signs and verifies for real with no
  # FFI or native-assets step — the golden vectors in spec/sync/ are byte-
  # compared against the backend's PyNaCl output.
  cryptography: ^2.9.0
  # SHA-256 for the author-key id and the per-author envelope chain. Imported
  # directly by lib/sync/, so it is a declared dependency rather than the
  # transitive one it used to be.
  crypto: ^3.0.6
  # The op-log append in lib/sync/sync_client.dart tells a taken slot apart from
  # every other database failure by SQLite's extended result code, so it imports
  # the exception type directly. Already in the graph under drift, so making it
  # direct adds no resolution risk.
  sqlite3: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.32.0
  retrofit_generator: ^10.2.8
  # Icon generation: flavored configs live in flutter_launcher_icons-<flavor>.yaml
  # at app/ root (per-flavor is the format flutter_launcher_icons supports; see
  # https://pub.dev/packages/flutter_launcher_icons). Regenerate with:
  #   dart run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml
  #   dart run flutter_launcher_icons -f flutter_launcher_icons-production.yaml
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/images/
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        # Variable font: single TTF covers weights 200–800. Flutter reads the
        # `wght` axis automatically when a `fontWeight` is applied.
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
