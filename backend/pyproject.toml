[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeeves-backend"
# Not the server version, and deliberately not kept in step with it: nothing
# consumes this wheel's version, and a second copy of the number would only
# drift.  The deployed server version comes from SERVER_VERSION — see
# docs/BACKEND_GUIDELINES.md, "Server versioning & releases".
version = "0.0.0"
description = "Jeeves — FastAPI backend"
# The single source of truth for the interpreter, and a band rather than a
# floor.  Everything else derives from it: ruff infers `target-version` from
# the floor, mypy defaults to the interpreter uv resolves out of the band, and
# .github/workflows/backend-ci.yml leaves setup-uv's `python-version` unset so
# CI resolves it the same way.  None of them carries its own copy.
#
# The ceiling is what makes backend/Dockerfile answerable to this file.  Dokku
# builds that image on deploy, so its `FROM` line is what production runs, and
# `pip install -e .` refuses an interpreter outside this band — a base-image
# bump past the ceiling fails the build instead of shipping an untested
# interpreter.  Dependabot walked the tag to 3.15.0rc1 and prod ran a release
# candidate for three weeks precisely because nothing said no.  Widening this
# to `<3.16` is how a Python minor upgrade is taken, deliberately, in one edit.
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.2",
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.31",
    "httpx>=0.27.0",
    "redis>=5.0.4",
    "PyNaCl>=1.5.0",
    "base58>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "fakeredis>=2.23.0",
    "httpx-ws>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Pins the resolver itself, not just what it resolves.  `uv.lock` fixes the
# dependency set; without this, uv's own version still floats — CI would take
# whatever `astral-sh/setup-uv` happens to default to, and a release that
# changed resolution or lockfile-format behaviour would arrive unannounced.
#
# This is the only place uv's version is written.  setup-uv reads it from here
# (its `version` input is left unset in .github/workflows/backend-ci.yml, so it
# falls back to `[tool.uv] required-version` in this file), and uv enforces it
# again at runtime: a mismatched uv refuses to run any subcommand rather than
# proceeding quietly.  Bumping uv is therefore a deliberate edit here.
required-version = "==0.12.0"

[tool.ruff]
line-length = 100
# No `target-version`: ruff infers it from `requires-python` above.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
# No `python_version`: mypy checks against whichever interpreter it runs on,
# and `uv run` supplies one from the `requires-python` band above.
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
