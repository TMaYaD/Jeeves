<title>Jeeves Day Timeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: a sheet of phone frames (390px) in a wrapping grid, then one wide desktop frame.
   Plan = tinted block outline; record = sprint bars in a lane at real time; events = hatched, left column. */
:root{
  --bg:#EEF1F6; --surf:#FFFFFF; --surf2:#F6F8FB; --line:#DCE2EB; --text:#18202E; --mut:#4A5568; --faint:#667085;
  --pri:#2667B7; --pri2:#1E4F8F; --pri-text:#2667B7; --pri-tint:#E6EFFA; --on-pri:#FFFFFF;
  --green:#16A34A; --amber:#F59E0B; --red:#DC2626; --green-tint:#E5F5EB; --red-tint:#FDEAEA;
  --c-energy:#7C3AED; --c-est:#2563EB; --c-log:#16A34A; --c-due:#DC2626;
  --track:#E5E7EB; --lblue:#93C5FD; --hatch:#C9D1DE;
  /* sprint clock, as shipped (active_focus_screen.dart): do not change */
  --c-spr:#2563EB; --t-spr:#DBEAFE; --c-brk:#10B981; --t-brk:#D1FAE5; --t-over:#FEF3C7; --dot:#2563EB; --dote:#BFDBFE;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1017; --surf:#151C27; --surf2:#1B2432; --line:#2A3445; --text:#E8ECF3; --mut:#A9B4C6; --faint:#8D99AE;
  --pri-text:#7DB0F2; --pri-tint:#1A2A44; --green-tint:#14291D; --red-tint:#341A1A;
  --c-energy:#A78BFA; --c-est:#7AA2F7; --c-log:#4ADE80; --c-due:#F87171; --track:#2A3445; --hatch:#33405A; --pri2:#3B78C9; --c-spr:#5B8DF6; --t-spr:#1E2F52; --c-brk:#34D399; --t-brk:#123A30; --t-over:#3B2E10; --dot:#5B8DF6; --dote:#2F4468;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1017; --surf:#151C27; --surf2:#1B2432; --line:#2A3445; --text:#E8ECF3; --mut:#A9B4C6; --faint:#8D99AE;
  --pri-text:#7DB0F2; --pri-tint:#1A2A44; --green-tint:#14291D; --red-tint:#341A1A;
  --c-energy:#A78BFA; --c-est:#7AA2F7; --c-log:#4ADE80; --c-due:#F87171; --track:#2A3445; --hatch:#33405A; --pri2:#3B78C9; --c-spr:#5B8DF6; --t-spr:#1E2F52; --c-brk:#34D399; --t-brk:#123A30; --t-over:#3B2E10; --dot:#5B8DF6; --dote:#2F4468;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700;margin:44px 0 4px}
.lede{color:var(--mut);max-width:70ch;margin:6px 0 0}
.sub{color:var(--mut);margin:0 0 16px;max-width:75ch}
.tog{border:1px solid var(--line);background:var(--surf);padding:8px 14px;border-radius:2px;font-weight:600;cursor:pointer}
.tog:focus-visible,.btn:focus-visible{outline:2px solid var(--pri-text);outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.fig{display:flex;flex-direction:column;gap:8px;width:390px;max-width:100%}
.cap{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.phone{width:390px;max-width:100%;background:var(--surf);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.bar b{font-size:17px;font-weight:700}
.bar small{color:var(--mut);font-weight:500}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surf);padding:9px 14px;border-radius:2px;font-weight:600;cursor:pointer;font-size:14px}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.t{border-color:transparent;background:transparent;color:var(--pri-text);padding-inline:6px}
.btn.sm{padding:5px 10px;font-size:13px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2.end{justify-content:flex-end}
.ic{width:13px;height:13px;flex:none}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent)}
.chip.en{--cc:var(--c-energy)}.chip.es{--cc:var(--c-est)}.chip.lg{--cc:var(--c-log)}.chip.du{--cc:var(--c-due)}
.ctx{font-size:12px;color:var(--mut);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut);background:var(--surf)}
/* capacity */
.capwrap{display:flex;flex-direction:column;gap:6px}
.capline{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;flex-wrap:wrap}
.capline span:last-child{color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.capbar{position:relative;height:10px;border-radius:4px;background:var(--track);display:flex;overflow:hidden}
.capbar i{display:block;height:100%}
.capmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.capbar-w{position:relative}
/* rows */
.list{display:flex;flex-direction:column}
.task{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.st{width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);margin-top:2px;flex:none}
.st.done{background:var(--green);border-color:var(--green)}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.tb .ti{font-weight:700;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--mut);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pips{display:inline-flex;gap:3px}
.pips u{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--mut);display:block}
/* timeline */
.tlw{padding:6px 16px 14px}
.tl{position:relative;margin-left:44px}
.hr{position:absolute;left:-44px;right:0;height:0}
.hr span{position:absolute;left:0;top:-8px;width:38px;font-size:11px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.hr::after{content:'';position:absolute;left:44px;right:0;top:0;border-top:1px solid var(--line)}
.ev{position:absolute;left:0;width:33%;border-radius:4px;padding:4px 6px;font-size:12px;overflow:hidden;color:var(--mut);border:1px solid var(--hatch);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 6px)}
.ev b{display:block;font-weight:700;color:var(--text);background:var(--surf);width:fit-content;padding:0 3px;border-radius:2px;line-height:1.3}
.ev i{font-style:normal;font-size:11px;background:var(--surf);padding:0 3px;border-radius:2px;display:block;width:fit-content;margin-top:1px}
.bx{position:absolute;left:35%;right:20px;border-radius:6px;padding:5px 8px;overflow:hidden;font-size:12px;border:1px solid var(--pri);background:var(--pri-tint);display:flex;flex-direction:column;gap:2px}
.noev .bx{left:0}
.bx .bt{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;min-width:0}
.bx .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.bx .bm{color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:6px;flex-wrap:wrap}
.bx .sc{font-weight:700;color:var(--text)}
.bx .nt{font-size:11px;color:var(--mut);font-weight:600}
.bx.sm{padding:1px 8px;justify-content:center;flex-direction:row;align-items:center}
.bx.sm .sc{font-size:11px;white-space:nowrap}
.bx.lim{border-bottom:4px solid var(--pri2)}
.bx.running{background:var(--pri);color:var(--on-pri);border-color:var(--pri2)}
.bx.running .bm,.bx.running .nt,.bx.running .sc{color:var(--on-pri)}
.bx.done{background:var(--green-tint);border-color:var(--green)}
.bx.missed{background:transparent;border:1px dashed var(--faint);color:var(--mut)}
.bx .tags{display:flex;gap:4px;flex-wrap:wrap}
.bx .tag{background:var(--surf);color:var(--text)}
.live{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.lane{position:absolute;right:0;width:14px;top:0;bottom:0;border-left:1px solid var(--line)}
.sp{position:absolute;left:4px;width:7px;border-radius:2px;background:var(--pri2)}
.sp.lv{background:repeating-linear-gradient(180deg,var(--pri2) 0 3px,transparent 3px 5px)}
.now{position:absolute;left:-44px;right:0;border-top:2px solid var(--pri-text);z-index:3}
.now span{position:absolute;left:0;top:-10px;font-size:11px;font-weight:800;background:var(--pri);color:var(--on-pri);padding:0 4px;border-radius:2px}
.gap{position:absolute;left:35%;right:20px;border:1px dashed var(--pri-text);border-radius:6px;color:var(--pri-text);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--pri) 5%,transparent)}
.noev .gap{left:0}
.gap.sug{border-style:solid;background:var(--pri-tint)}
.strip{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--red);background:var(--red-tint);border-radius:6px;font-size:13px;font-weight:600;text-align:left}
.bx .nt.over{color:var(--text);font-weight:700;display:flex;gap:4px;align-items:center}
.bx .nt.over .ic{color:var(--red)}
.sp.ov{background:var(--red)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}.cmp th,.cmp td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}.cmp th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);font-weight:600;padding:0 16px 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-ev{width:16px;height:10px;border:1px solid var(--hatch);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--hatch) 3px 4px)}
.lg-bx{width:16px;height:10px;border:1px solid var(--pri);background:var(--pri-tint);border-radius:2px}
.lg-ov{width:5px;height:12px;background:var(--red);border-radius:2px}
.lg-sp{width:5px;height:12px;background:var(--pri2);border-radius:2px}
/* banners, sheets, jeeves */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surf2);font-size:13px}
.note.red{border-color:var(--red);background:var(--red-tint)}
.note.neutral{background:var(--surf2)}
.note b{display:block}
.note span{color:var(--mut)}
.jv b{display:block;font-size:16px;font-weight:700}
.jv span{display:block;color:var(--mut);font-size:13px;font-weight:400}
.sheet{border-top:1px solid var(--line);background:var(--surf);padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 16px rgba(0,0,0,.06)}
.sheet h3{margin:0;font-size:15px}
.trayh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--surf2);font-weight:700;font-size:13px}
.sk{border-radius:4px;background:var(--track);animation:shim 1.4s ease-in-out infinite}
@keyframes shim{50%{opacity:.45}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.sync i{width:9px;height:9px;border-radius:50%;border:2px solid var(--amber);display:block;border-right-color:transparent}
.tbbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--surf2);color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tbbtn .ic{width:18px;height:18px}
.tbbtn[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.tbbtn:focus-visible{outline:2px solid var(--pri-text);outline-offset:2px}
.tipw{position:relative;display:inline-block}
.tip{position:absolute;right:0;top:42px;width:230px;padding:8px 10px;border-radius:4px;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;z-index:4}
.est{display:flex;align-items:center;gap:8px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stepper button{width:34px;height:34px;border:0;background:var(--surf2);font-weight:700;font-size:16px;cursor:pointer}
.stepper output{min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.setrow small{display:block;color:var(--mut);font-size:12px}
/* focus */
.focus{align-items:center;text-align:center;padding:18px 16px 20px;display:flex;flex-direction:column;gap:12px}
.ringw{position:relative;width:216px;height:216px}
.ringw svg{width:100%;height:100%;display:block}
.trk{stroke:var(--trk);fill:none}.arc{stroke:var(--ring);fill:none;stroke-linecap:round}.mk{fill:var(--ring)}.tk{stroke:var(--trk);stroke-width:2;stroke-linecap:round}.tk.on{stroke:var(--ring)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rc .n{font-weight:700;font-size:14px;color:var(--mut)}
.rc .t{color:var(--ring);font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.05}
.rc .s{font-size:12px;font-weight:600;color:var(--mut)}
.v-P .rc .t{font-weight:700}.v-I .rc .t{font-weight:500;font-size:38px}
.rd{display:flex;align-items:center;justify-content:center;gap:16px}
.dots{display:flex;flex-direction:column;align-items:center;justify-content:center}
.dg{display:flex;flex-direction:column}.dg+.dg{margin-top:8px}
.dot{width:14px;height:14px;margin:5px 0;border-radius:50%;border:2px solid var(--dote);display:block;flex:none}
.dot.f{background:var(--dot);border-color:var(--dot)}
.dot.ov{border-color:var(--red)}.dot.f.ov,.dot.cur.ov{background:var(--red);border-color:var(--red)}
.dot.cur{background:var(--dot);border-color:var(--dot);animation:pulse2 1.1s ease-in-out infinite alternate}
@keyframes pulse2{from{transform:scale(.82)}to{transform:scale(1.18)}}
.ringw.long::before{content:'';position:absolute;inset:-7px;border:1px solid var(--c-brk);border-radius:50%}
.focus h4{margin:0;font-size:17px;font-weight:700}
.focus .meta{color:var(--mut);font-size:13px;font-weight:600}
.mini{width:100%}
.matrix{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:12px;overflow-x:auto;min-width:0}
.cell{border:1px solid var(--line);border-radius:6px;background:var(--surf);padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cell .ringw{width:140px;height:140px}.cell .dot{width:10px;height:10px;margin:2px 0}.cell .rd{gap:8px}.cell .rc .t{font-size:28px}.cell .rc .n{font-size:12px}.cell .rc .s{display:none}
.cell small{font-size:11px;color:var(--mut);font-weight:600;text-align:center}
.xs{overflow-x:auto}
.mh{display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:6px}
.pool{display:flex;flex-direction:column;gap:10px}
.pool div{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surf)}
.pool b{display:block;font-size:14px}.pool span{color:var(--mut);font-size:13px}
.desk{border:1px solid var(--line);border-radius:6px;background:var(--surf);min-width:1100px;display:grid;grid-template-columns:300px 1fr 330px}
.desk>div{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.desk>div+div{border-left:1px solid var(--line)}
.desk .task{padding-inline:0}
.dtop{grid-column:1/-1;display:flex;gap:24px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dtop .capwrap{flex:1;min-width:320px}
.ul{margin:0;padding-left:18px;color:var(--mut);max-width:80ch}
.ul li{margin:4px 0}
@media (prefers-reduced-motion:reduce){.live,.dot.cur,.sk{animation:none}}
</style>

<div class="wrap">
<header class="top">
  <div>
    <h1>Jeeves — Suggested times, sprints and the day timeline</h1>
    <p class="lede">Phone first, then the wide shell. The plan (a tile at its suggested time) and what happened (sprints, time logged) are drawn separately and never reconciled. Sprint counts appear in words as “Sprint N” and as a hint in the dots only.</p>
  </div>
  <button class="tog" id="tog" type="button">Switch light / dark</button>
</header>

<div id="app"></div>
</div>

<script>
const $=(s)=>document.querySelector(s);
const m=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const hm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const fmt=n=>n<60?n+'m':(n%60?Math.floor(n/60)+'h '+n%60+'m':Math.floor(n/60)+'h');
const SPR=20, LONG_EVERY=4; /* sprints per long break: Settings, default 4 */
const I={
 tbx:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="4.8"/><path d="M8 8V5.6M6.3 1.4h3.4"/><path d="M2 14.6h12" stroke-width="2.2"/></svg>',
 bolt:'<svg class="ic" viewBox="0 0 16 16"><path d="M9 1 3 9h4l-1 6 6-8H8z" fill="currentColor"/></svg>',
 timer:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="9.2" r="5.3"/><path d="M8 9V6M6 1.6h4"/></svg>',
 clock:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.4 1.5"/></svg>',
 cal:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg>',
 check:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
 info:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" style="margin-top:2px"><circle cx="8" cy="8" r="6"/><path d="M8 7.2V11M8 4.8v.1"/></svg>',
 warn:'<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" style="margin-top:2px"><path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3.3M8 11.6v.1"/></svg>'
};
/* ---------- chips / rows ---------- */
function row(o){
  const h=o.est?Math.ceil(o.est/SPR):0;
  const chips=[];
  if(o.energy)chips.push(`<span class="chip en">${I.bolt}${o.energy}</span>`);
  if(o.setEst)chips.push('<span class="ctx" style="color:var(--faint)">Set</span>');
  if(o.est)chips.push(`<span class="chip es" ${o.tbx?'title="Timeboxed: the estimate is a limit"':''}>${I.timer}${fmt(o.est)}${o.tbx?I.tbx:''}</span>`);
  if(o.logged)chips.push(`<span class="chip lg">${I.clock}${fmt(o.logged)}</span>`);
  if(o.due)chips.push(`<span class="chip du">${I.cal}${o.due}</span>`);
  if(o.ctx)chips.push(`<span class="ctx">${o.ctx}</span>`);
  const hint=h?`<span class="hint"><span class="pips" aria-hidden="true">${'<u></u>'.repeat(Math.min(h,6))}</span>about ${h} sprint${h>1?'s':''}</span>`:'';
  const extra=[o.added?'<span class="tag">Added during the day</span>':'',o.placed?`<span class="tag">Suggested ${o.placed}</span>`:''].join('');

/* ---------- capacity ---------- */
function cap(est,noest,free,label){
  const scale=Math.max(est+noest,free);
  /* one status tone for the estimated segment, keyed off the combined ratio (DESIGN.md § Capacity bar) */
  const ratio=(est+noest)/free, tone=ratio>1?'var(--red)':(ratio>.8?'var(--amber)':'var(--green)');
  const p=x=>(x/scale*100).toFixed(2)+'%';
  const total=est+noest, over=total-free;
  const status=over>0?`${I.warn}Over by ${fmt(over)}`:(est+noest>.8*free?`${I.info}Near the limit`:`${I.check}Room to spare`);
  return `<div class="capwrap"><div class="capline"><span>${fmt(total)} planned of ${fmt(free)} free</span><span>${status}</span></div>
  <div class="capbar-w"><div class="capbar"><i style="width:${p(est)};background:${tone}"></i><i style="width:${p(noest)};background:var(--lblue)"></i></div>${over>0?`<span class="capmark" style="left:${p(free)}"></span>`:''}</div>${label?`<div class="ctx">${label}</div>`:''}</div>`;
}
/* ---------- timeline ---------- */
function tl(o){
  const ppm=o.ppm||1.2,f=m(o.from),t=m(o.to),H=(t-f)*ppm;
  let h='';
  for(let x=Math.ceil(f/60)*60;x<=t;x+=60)h+=`<div class="hr" style="top:${(x-f)*ppm}px"><span>${hm(x)}</span></div>`;
  (o.events||[]).forEach(e=>{const s=m(e[0]),d=m(e[1])-s;h+=`<div class="ev" style="top:${(s-f)*ppm}px;height:${d*ppm-2}px"><b>${e[2]}</b>${d*ppm>34?`<i>${e[0]}–${e[1]} · Event</i>`:''}</div>`});
  (o.skel||[]).forEach(e=>{const s=m(e[0]),d=m(e[1])-s;h+=`<div class="ev sk" style="top:${(s-f)*ppm}px;height:${d*ppm-2}px;border:0"></div>`});
  let lane='';
  (o.boxes||[]).forEach(b=>{
    const s=m(b.s),Hh=b.d*ppm-2,sm=Hh<40,n=b.n||(b.sprints||[]).length;
    const logged=(b.sprints||[]).reduce((a,x)=>a+x[1],0);
    const cnt=n?`<span class="sc">${n} sprint${n>1?'s':''} · ${fmt(b.logged||logged)}</span>`:'';
    const glyph=b.state==='done'?I.check:(b.state==='running'?'<span class="live"></span>':'');
    let inner;
    if(sm)inner=`${glyph}<span class="tt">${b.t}</span>${cnt||(b.state==='missed'?'<span class="sc">Not started</span>':'')}`;
    else{
      const live=b.state==='running'?`<span class="sc">Sprint ${b.sprintNo} · ${b.left} left</span>`:'';
      const list=(b.d>=120&&n)?`<div class="nt">${b.sprints.map((x,i)=>`${i+1}: ${hm(m(x[0]))} · ${fmt(x[1])}`).join('  ·  ')}</div>`:'';
      inner=`<div class="bt">${glyph}<span class="tt">${b.t}</span></div><div class="bm"><span>${b.s}–${hm(s+b.d)}</span><span>${fmt(b.d)}</span>${cnt}${live}${b.state==='missed'?'<span class="sc">Not started</span>':''}</div>${list}${b.note&&Hh>=64?`<div class="nt ${b.over?'over':''}">${b.over?I.warn:''}${b.note}</div>`:''}${((b.lim||b.tags)&&Hh>=56)?`<div class="tags">${(b.lim?['Timeboxed']:[]).concat(b.tags||[]).map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:''}`;
    }
    h+=`<div class="bx ${b.state||''} ${b.lim?'lim':''} ${sm?'sm':''}" style="top:${(s-f)*ppm}px;height:${Hh}px">${inner}</div>`;
    (b.sprints||[]).forEach(x=>{lane+=`<div class="sp ${x[2]||''}" style="top:${(m(x[0])-f)*ppm}px;height:${Math.max(x[1]*ppm,3)}px"></div>`});
  });
  (o.gaps||[]).forEach(g=>{const s=m(g[0]),d=m(g[1])-s;h+=`<div class="gap ${g[3]||''}" style="top:${(s-f)*ppm}px;height:${d*ppm-2}px">${g[2]}</div>`});
  if(o.now)h+=`<div class="now" style="top:${(m(o.now)-f)*ppm}px"><span>Now ${o.now}</span></div>`;
  return `<div class="tlw"><div class="tl ${o.noev?'noev':''}" style="height:${H}px">${h}<div class="lane">${lane}</div></div></div>`;
}

/* ---------- focus ---------- */
const lerp=(x,y,t)=>x+(y-x)*t;
const mixOver=t=>'rgb('+[245,158,11].map((v,i)=>Math.round(lerp(v,[220,38,38][i],t))).join(',')+')';
/* kind: spr (countdown, CCW) | brk (countdown, CW) | over (sprint overtime, CW, grows) | bover (break overtime, CCW, grows)
   p: remaining fraction for countdowns, overtime fraction for overtime. Mirrors _RingPainter. */
function kindOf(over,brk){return over?(brk?'bover':'over'):(brk?'brk':'spr')}
function cols(kind,p){
  if(kind==='over'||kind==='bover')return [mixOver(p),'var(--t-over)'];
  return kind==='brk'?['var(--c-brk)','var(--t-brk)']:['var(--c-spr)','var(--t-spr)'];
}
function arcPath(p,cw,r){
  if(p<=0)return '';const f=cw?1:0;
  if(p>=.999)return `M100 ${100-r}A${r} ${r} 0 1 ${f} 100 ${100+r}A${r} ${r} 0 1 ${f} 100 ${100-r}`;
  const a=-Math.PI/2+(cw?1:-1)*p*2*Math.PI;
  return `M100 ${100-r}A${r} ${r} 0 ${p>.5?1:0} ${f} ${100+r*Math.cos(a)} ${100+r*Math.sin(a)}`;
}
function ring(v,p,kind){
  const cw=kind==='brk'||kind==='over';
  const a=-Math.PI/2+(cw?1:-1)*Math.min(p,1)*2*Math.PI;
  if(v==='M')return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90" stroke-width="2"/><path class="arc" d="${arcPath(p,cw,90)}" stroke-width="3"/><circle class="mk" cx="${100+90*Math.cos(a)}" cy="${100+90*Math.sin(a)}" r="6"/></svg>`;
  if(v==='P')return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90" stroke-width="11"/><path class="arc" d="${arcPath(p,cw,90)}" stroke-width="11"/></svg>`;
  let t='';const lit=Math.round(Math.min(p,1)*60);
  for(let i=0;i<60;i++){const an=i/60*2*Math.PI-Math.PI/2,r1=i%5?82:76,off=cw?i:(60-i)%60;
    t+=`<line class="tk ${off<lit?'on':''}" x1="${100+r1*Math.cos(an)}" y1="${100+r1*Math.sin(an)}" x2="${100+90*Math.cos(an)}" y2="${100+90*Math.sin(an)}"/>`}
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${t}<circle class="trk" cx="100" cy="100" r="66" stroke-width="1"/><circle class="mk" cx="${100+66*Math.cos(a)}" cy="${100+66*Math.sin(a)}" r="4"/></svg>`;
}
/* dots: vertical column beside the ring, as shipped. Completed and current are solid, the rest outlined; current pulses 0.82 to 1.18. */
function dots(done,hint,onBreak,limit){
  const completed=onBreak?done+1:done, total=Math.max(hint,completed+(onBreak?0:1));
  let g=[],cell='';
  for(let i=0;i<total;i++){
    const ov=limit!=null&&i>=limit&&(i<completed||(!onBreak&&i===done));
    cell+=`<span class="dot ${i<completed?'f':(!onBreak&&i===done?'cur':'')} ${ov?'ov':''}"></span>`;
    if((i+1)%LONG_EVERY===0||i===total-1){g.push(`<span class="dg">${cell}</span>`);cell=''}
  }
  return `<div class="dots" role="img" aria-label="${completed} sprints done">${g.join('')}</div>`;
}
/* frac: elapsed fraction for countdowns (converted to remaining), overtime fraction when over */
function ringBlock(v,frac,n,time,sub,done,hint,over,cls,brk,limit){
  const kind=kindOf(over,brk),p=over?frac:Math.max(0,1-frac),[c,t]=cols(kind,p);
  return `<div class="rd"><div class="ringw v-${v} ${cls||''}" style="--ring:${c};--trk:${t}">${ring(v,p,kind)}<div class="rc"><span class="n">${n}</span><span class="t">${time}</span>${sub?`<span class="s">${sub}</span>`:''}</div></div>${dots(done,hint,brk,limit)}</div>`;
}

$('#app').innerHTML=`
<h2>1 · Day timeline</h2>
<p class="sub">On a phone the timeline owns the screen. Outcomes flow onto it by themselves. One that fits no gap waits in a tray under it, and “Set the time” (or dragging the row) lets the user choose a time. Both end at the same sheet, so nothing depends on dragging.</p>

<h2>Tile states and sprint marks</h2>
<p class="sub">A tile is one block, sized by the estimate, with no sprint or break blocks inside. What was done is drawn in a lane at the right edge, at the real times, so it can run past the block or fall short of it without “correcting” anything. Inside the block a count says how many sprints and how much time. At 15 minutes the block reduces to one line; at 3 hours it also lists each sprint.</p>
<div class="grid">${fig('Six states',boxGallery())}${fig('Short and long tiles',scaleGallery())}</div>
<h2>Day timeline states</h2>
<div class="grid">${states()}</div>

<h2>Autoflow and overrides</h2>
<p class="sub">By default no tile overlaps an event. Jeeves flows each Plan Outcome into the first gap that holds its estimate, and re-flows when the calendar changes. Outcomes are unordered, so a small one may fill an earlier gap; the steps within an Outcome keep their order. A gap that holds an Outcome whole is always preferred; failing that, it is split into pieces that fit the gaps. The chunk is one sprint plus its short break (23m at the defaults), so there is no extra setting; the last piece takes the remainder. Setting a time yourself pins it: it may overlap, and it never moves on its own. Moves are announced once, with Undo. Past and engaged suggested times are never re-flowed.</p>
<div class="grid">${autoflow()}</div>

<h2>Timeboxed Actions have limits</h2>
<p class="sub">An estimate is a guess and may be wrong in either direction without comment. A Timeboxed Action’s estimate is the limit the user chose, so every sprint started past it is discouraged. The discouragement is friction and candour, never a lock: Jeeves advises, the buttons put stopping first, and “regardless” still works. A sprint already running when the limit passes is left alone; the strip simply states the fact. There is no separate length: “Timeboxed” is a switch on the Outcome that makes its estimate the limit.</p>
<div class="grid">${limits()}</div>

<h2>2 · Small-task suggestion</h2>
<p class="sub">The suggestion lives in the free gap as a quiet outline. Nothing moves until “Very good”. Accepting produces separate, adjacent tiles that run as one sprint (the batching algorithm is still to be designed).</p>
<div class="grid">${suggestion()}</div>

<h2>3 · Focus Mode sprint counter</h2>
<p class="sub">“Sprint N” is always the words. The hint is carried only by dots: hollow for sprints still hinted, filled for done, a pulsing halo on the current one. Dots group by the number of sprints per long break (4 by default, set in Settings), so each gap marks where a long break falls and twelve still read at a glance. Past the hint, the dots simply continue.</p>

<h2>Wide screen</h2>
<p class="sub">The same timeline gets room: events and tiles sit in two columns, the sprint lane is wider to read, and the Now panel keeps the sprint clock and the current suggestion in view. Scroll sideways inside the frame on a narrow window.</p>
${desktop()}

<h2>Decisions to check</h2>
<ul class="ul">
<li><b>Sprint clock, preserved from the shipped app:</b> sprint ring #2563EB on #DBEAFE, break ring #10B981 on #D1FAE5, overtime blending amber to red on #FEF3C7. Fill follows the clock: a countdown drains full to empty, overtime grows empty to full. Direction: a sprint countdown drains counter-clockwise, a break countdown clockwise, sprint overtime clockwise, break overtime counter-clockwise. The Monastic, Paced and Instrument looks change only the drawing style, never these rules. Dots stay a vertical column beside the ring, solid blue when done or current, outlined #BFDBFE otherwise, the current one pulsing.</li>
<li>Dark-theme values for the clock colours are mine, since the shipped app is light only.</li>
<li>The “now” line and live sprint on the timeline use primary blue.</li>
<li>State is carried by shape and text too: ticks on done blocks, dashed outlines on not-engaged ones, “Overlaps …”, “Added during the day”, “Over by 40m”, dot fill versus hollow.</li>
<li>Sprint 12 only occurs if long breaks were skipped; the dots still fit, grouped by sprints per long break.</li>
<li><b>Timeboxed:</b> a switch on a step (Action) beside its estimate, not on the Outcome. The estimate tag opens a dialog with the time and the icon; with no estimate the tag is a quiet “Set”. Only Timeboxed steps show the limit edge, the red overflow dots and the pre-sprint advice. The wider Project / Outcome / step model is a later design sprint, so rows here still show the estimate chip on the Outcome.</li>
<li><b>Raising the estimate</b> is permanent; carrying on regardless never changes it.</li>
<li><b>Chunking</b> uses the sprint-plus-break unit from Settings and affects layout only; sprints done and their lengths stay independent of the estimate. <b>Batching</b> is wanted; its algorithm is not designed yet. A chunked Outcome shows as separate tiles (“part 1”, “part 2”); a batch shows as adjacent tiles with no break between them. Open: a Timeboxed limit would be the total time on the Action across its pieces, not per piece.</li>
<li><b>Overflow dots:</b> on a Timeboxed Action, dots for sprints started past the limit are red. The red dots are the only marker; no dash is drawn. Hollow hint dots stay blue. This is a change from the shipped dots, by your decision.</li>
<li><b>Estimate stays quiet:</b> the “no warning past the hint” rule still holds for estimates. Red appears only for sprints past a Timeboxed limit.</li>
<li><b>Autoflow:</b> an Outcome with no estimate flows using the assumed default. Only pinned starts are stored. Time contexts are built, but flow does not use them yet and they are not drawn here; flow will take an Action’s Time context as one more constraint beside gap length.</li>
<li>Not designed here, per scope: the sprint-end sheet, estimate-versus-actual analytics.</li>
</ul>
