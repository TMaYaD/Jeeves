name: PR APK Build

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]

concurrency:
  group: pr-apk-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect Android-relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          if echo "$CHANGED" | grep -qE \
            '^app/|^\.github/workflows/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-distribute:
    name: build-and-distribute
    needs: check-changes
    if: needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Set up Android signing
        uses: ./.github/actions/setup-android-signing
        with:
          dev-keystore-base64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          dev-keystore-password: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          dev-key-alias: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          dev-key-password: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --profile --split-per-abi --target-platform android-arm64 --flavor dev

      - name: Compose release notes
        id: notes
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_TITLE: ${{ github.event.workflow_run.pull_requests[0].title }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA::7}"
          NOTES="PR #${PR_NUMBER}: ${PR_TITLE} | branch: ${PR_BRANCH} | sha: ${SHORT_SHA}"
          printf 'notes=%s\n' "$NOTES" >> "$GITHUB_OUTPUT"

      - uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_DEV }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: dev
          file: app/build/app/outputs/flutter-apk/app-arm64-v8a-dev-profile.apk
          releaseNotes: ${{ steps.notes.outputs.notes }}
