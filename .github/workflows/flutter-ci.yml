name: Flutter CI

on:
  push:
    branches: [main]
    paths: ["app/**"]
  pull_request:
    branches: [main]
    paths: ["app/**"]

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - run: flutter pub get

      # Lockfile-drift guard. `pub get` rewrites pubspec.lock when the active
      # Dart SDK ships different versions of vendored packages (meta, analyzer,
      # _fe_analyzer_shared, dart_style, …) than the lockfile expects. With
      # the SDK pinned via .fvmrc, any diff here means a developer either
      # forgot to commit a `pub upgrade` or resolved against a different SDK.
      #
      # The `-I` pattern ignores the lockfile's `sdks.flutter` line: Dependabot's
      # pub helper records the Flutter constraint as `">=X.Y.Z"` where real
      # `flutter pub get` writes the verbatim pin `"X.Y.Z"`. The package
      # resolution is identical either way, and without the exception every
      # Dependabot pub PR fails this guard on that one cosmetic line.
      - name: Verify pubspec.lock is up to date
        run: |
          if ! git diff -I'^  flutter: ".*"$' --exit-code pubspec.lock; then
            echo "::error::pubspec.lock changed after 'flutter pub get'."
            echo "::error::Run 'flutter pub get' locally (with the Flutter version pinned in app/.fvmrc) and commit the result."
            exit 1
          fi

      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  android-build-changes:
    name: Detect Android-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - 'app/android/**'
              - 'app/pubspec.yaml'
              - 'app/pubspec.lock'
              - 'app/.fvmrc'
              - '.github/workflows/flutter-ci.yml'

  android-build:
    name: Android Gradle Build
    needs: android-build-changes
    if: needs.android-build-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-

      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Exercises the full Gradle/AGP/Kotlin plugin chain so toolchain-incompatible
      # version bumps (e.g. Dependabot AGP majors) fail this PR check instead of
      # slipping through and breaking main. Debug + single ABI keeps it fast and
      # avoids any signing/secret requirements: debug builds are signed by AGP's
      # auto-managed ~/.android/debug.keystore regardless of signingConfigs, so
      # the setup-android-signing action is intentionally not invoked here.
      - run: flutter build apk --debug --flavor production --target-platform android-arm64
