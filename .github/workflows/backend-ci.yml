name: Backend CI

# This workflow is the gate for Backend CD, which deploys the backend — so
# everything CD depends on has to be validated here, and the trigger has to
# cover everything that can invalidate it.  Hence infra/ paths, and hence the
# infra-shell job below living in this workflow rather than a separate one: a
# separate workflow could not gate CD without racing it (CD fires on this
# workflow's conclusion, and would happily deploy while the other was still
# running or already red).
#
# The CD job's own `grep '^backend/'` check scopes the actual Dokku push, so an
# infra-only commit gates CD without redeploying the backend.
on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", ".githooks/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", "infra/**", ".githooks/**", ".github/workflows/backend-ci.yml"]

# Every job here checks out the repo and runs local tools — none writes to the
# repository, publishes a package, or touches a check or comment.  Declared at
# the workflow level rather than per job so a new job inherits the floor instead
# of silently getting the default token scope.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv, not pip: `uv sync --locked` installs exactly what backend/uv.lock
      # pins, so no tool version is written here.  `working-directory` points
      # the action at backend/ so its cache key is keyed on backend/uv.lock —
      # and so the deliberately-unset `version` input falls back to
      # `[tool.uv] required-version` in backend/pyproject.toml, which is where
      # uv's own version is pinned.
      #
      # `python-version` is deliberately unset for the same reason.  Setting it
      # only exports UV_PYTHON; leaving it alone lets uv resolve the interpreter
      # from `requires-python` in backend/pyproject.toml, so CI type-checks and
      # tests on the same interpreter band backend/Dockerfile ships.  It used to
      # say "3.12" while production ran 3.15.0rc1, and neither number was
      # answerable to the other.  Every knob stays in backend config.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          enable-cache: true
      # A named check, so drift between pyproject.toml and uv.lock fails as
      # "lockfile out of date" instead of surfacing as a resolution error in
      # the install step below.
      - name: Check uv.lock is up to date
        run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://jeeves:jeeves@localhost:5432/jeeves_test
      # Matches the value tests/conftest.py seeds locally, so the health test
      # asserts the same version here and on a developer machine.
      SERVER_VERSION: 1.2.3-test

    # The Postgres service is load-bearing for pytest, not just for the
    # `python -m app.migrate` smoke check below: tests/test_migration_chain_postgres.py
    # runs the real migration chain against a scratch database it creates beside
    # jeeves_test, seeded with representative rows.  That seeding is what the
    # smoke check cannot do — it migrates an *empty* database, so a data-backfill
    # migration's SQL is never executed and never even prepared.  Migration 0028
    # broke five consecutive production deploys through a green run of this job
    # for exactly that reason.  DATABASE_URL must therefore stay set here; the
    # test fails rather than skips when CI is set, so dropping it is loud.
    services:
      postgres:
        # Tag names the exact version, digest pins the bytes.
        # Dependabot does not read workflow service images, so this one is
        # bumped by hand — keep it in step with infra/docker-compose.yml.
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: jeeves
          POSTGRES_PASSWORD: jeeves
          POSTGRES_DB: jeeves_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python -m app.migrate
      - run: uv run pytest --cov=app --cov-report=term-missing

  infra-shell:
    name: Infra & hooks shell lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Covers the extensionless test stubs as well as the *.sh scripts.
      - name: shellcheck
        run: |
          find infra/ci .githooks -type f \( -name '*.sh' -o -path '*/stubs/*' \) -print0 \
            | xargs -0 shellcheck --severity=style
          shellcheck --shell=sh .githooks/pre-commit
          shellcheck --shell=sh .githooks/prepare-commit-msg
      - name: compute-server-version.sh tests
        run: ./infra/ci/tests/test-compute-server-version.sh
      - name: pre-commit hook tests
        run: ./.githooks/tests/test-pre-commit-hook.sh
      - name: prepare-commit-msg hook tests
        run: ./.githooks/tests/test-prepare-commit-msg-hook.sh

