name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dokku
    runs-on: ubuntu-latest
    # Only a real push to this repository's main may deploy.  The `branches:`
    # filter above matches the head branch *name*, so a fork's pull request from
    # a branch called "main" would otherwise reach this job — and the scripts
    # below run from the checked-out head_sha, which for a fork is its own code.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      # write, not read: the release step below cuts the server/v* tag.
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Deploy pushes to Dokku over SSH (ssh-agent); the GITHUB_TOKEN is
          # never used, so don't persist it into .git/config.
          persist-credentials: false

      # Backend CI runs per push and two of them finish in whatever order their
      # test jobs happen to take, so a *successful* run is not necessarily the
      # *latest* one.  Deploying a superseded run force-pushes older backend
      # code over newer, on top of migrations that have already run.  But a
      # newer tip only deploys this change if it gets its own CD run, and it
      # does not when it touches nothing Backend CI triggers on.  The script
      # therefore skips this run only when a later commit will trigger one, and
      # otherwise lets it deploy its own commit — whose backend/ is identical to
      # the tip's.  The concurrency group above serialises runs but says nothing
      # about their order, so compare commits rather than assume.
      - name: Check this run is not superseded by a later Backend CD run
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TIP=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          ./infra/ci/backend-cd-freshness.sh "${RUN_SHA}" "${TIP}" | tee -a "$GITHUB_OUTPUT"

      # The version is computed from the commits since the last server/v* tag
      # that touch backend/.  The same walk decides the tag and whether to push
      # (the deploy output), so a tagged change is always deployed by the run
      # that tags it, whatever the tip commit itself touches.  The checkout's
      # fetch-depth: 0 brings the tags along with the history, so no extra
      # fetch option is needed.  The script only reads, and hard-fails if
      # the baseline tag was never seeded, so a forgotten seed stops the
      # pipeline instead of silently mislabelling a deploy.
      - name: Compute server version
        id: server-version
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          ./infra/ci/compute-server-version.sh | tee -a "$GITHUB_OUTPUT"

      # Tag before deploy: the version names the release cut, which is a
      # property of the commit, not of deploy success — /health is what reports
      # deployed reality.  A failed deploy therefore leaves a tag for code that
      # never ran, which is visible and is corrected by the next deploy;
      # tagging afterwards would instead let a failed push withhold a tag from
      # a backend that did ship.
      #
      # Creating the release also creates the tag, so nothing has to push over
      # the checkout's deliberately credential-less git remote.  Re-runs are
      # inert twice over: a re-run's range starts at the tag it already cut and
      # so computes bump=none, and the existence check below covers the window
      # where the tag has not yet propagated to the fresh checkout.
      - name: Tag and release the server version
        if: steps.freshness.outputs.current == 'true' && steps.server-version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.server-version.outputs.tag }}
          VERSION: ${{ steps.server-version.outputs.version }}
          NOTES: ${{ steps.server-version.outputs.notes }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${TARGET_SHA}" \
            --title "Server ${VERSION}" \
            --notes "${NOTES}"

      - name: Set up SSH
        if: steps.freshness.outputs.current == 'true' && steps.server-version.outputs.deploy == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      # Every step below reaches the host through a DOKKU_HOST env var rather
      # than expanding `vars.DOKKU_HOST` into `run:` directly.  The value is
      # maintainer-set, so this is not closing a live hole; it keeps the whole
      # template-injection class off the shell in the one place it could ever
      # appear in this workflow.

      # The host key is pinned rather than learned with ssh-keyscan at deploy
      # time.  ssh-keyscan trusts whatever answers on port 22, which makes every
      # deploy a fresh trust-on-first-use.  DOKKU_HOST_KEY holds the
      # known_hosts line(s) for DOKKU_HOST; a host public key is not a secret,
      # so it is a repository variable — visible in logs and in review, which is
      # what makes a wrong value noticeable.
      #
      # Rotating the host or its key means updating DOKKU_HOST_KEY.  See
      # "Deploy host trust" in docs/BACKEND_GUIDELINES.md.
      - name: Pin the Dokku host key
        if: steps.freshness.outputs.current == 'true' && steps.server-version.outputs.deploy == 'true'
        env:
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
          DOKKU_HOST_KEY: ${{ vars.DOKKU_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DOKKU_HOST" ] || [ -z "$DOKKU_HOST_KEY" ]; then
            echo "::error::Repository variables DOKKU_HOST and DOKKU_HOST_KEY must both be set. See 'Deploy host trust' in docs/BACKEND_GUIDELINES.md."
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          # Overwrite rather than append: the pinned key is the whole of what
          # this job is allowed to trust, so anything already there is dropped.
          printf '%s\n' "$DOKKU_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          # Fail here rather than at push time if the variable does not actually
          # cover this host — otherwise a mismatched pair reads as a deploy
          # failure instead of a configuration error.
          if ! ssh-keygen -F "$DOKKU_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo "::error::DOKKU_HOST_KEY contains no known_hosts entry for $DOKKU_HOST."
            exit 1
          fi

      # Dokku builds from a git archive with no `.git`, so the running process
      # cannot derive its own version — it has to be handed one.  It is gated
      # on the push that follows, not on a tag having been cut: a re-run after
      # a failed push still lands /health on the version the tags claim.
      # --no-restart because the push below rebuilds and restarts with the new
      # env anyway.
      - name: Inject the server version into Dokku
        if: steps.freshness.outputs.current == 'true' && steps.server-version.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.server-version.outputs.version }}
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
        run: |
          set -euo pipefail
          # StrictHostKeyChecking=yes refuses the connection on a mismatch
          # instead of prompting; GlobalKnownHostsFile=/dev/null means the
          # runner image's own known_hosts cannot satisfy the check, so the
          # pinned key is the only thing that can.
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null \
            "dokku@${DOKKU_HOST}" \
            config:set --no-restart jeeves "SERVER_VERSION=${VERSION}"

      - name: Deploy to Dokku
        if: steps.freshness.outputs.current == 'true' && steps.server-version.outputs.deploy == 'true'
        env:
          DOKKU_HOST: ${{ vars.DOKKU_HOST }}
          # Same pinning as the step above, applied to the transport git uses.
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null
        run: |
          git remote add dokku "ssh://dokku@${DOKKU_HOST}/jeeves"
          git push dokku HEAD:main --force

