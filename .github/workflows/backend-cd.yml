name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dokku
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Deploy pushes to Dokku over SSH (ssh-agent); the GITHUB_TOKEN is
          # never used, so don't persist it into .git/config.
          persist-credentials: false

      - name: Check for backend changes
        id: backend-changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^backend/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up SSH
        if: steps.backend-changes.outputs.changed == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}

      - name: Add Dokku host to known hosts
        if: steps.backend-changes.outputs.changed == 'true'
        run: ssh-keyscan -H "${{ vars.DOKKU_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        if: steps.backend-changes.outputs.changed == 'true'
        run: |
          git remote add dokku "ssh://dokku@${{ vars.DOKKU_HOST }}/jeeves"
          git push dokku HEAD:main --force
