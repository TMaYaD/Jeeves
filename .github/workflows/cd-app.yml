name: App CD

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      # GA release: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Stage transition markers (unnumbered). Alpha is computed, never tagged.
      - "v[0-9]+.[0-9]+.[0-9]+-beta"
      - "v[0-9]+.[0-9]+.[0-9]+-rc"

jobs:
  version:
    name: Compute Version
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push auto-retag when conventional commits bump target
    outputs:
      version: ${{ steps.compute.outputs.version }}
      pubspec_version: ${{ steps.compute.outputs.pubspec_version }}
      is_release: ${{ steps.compute.outputs.is_release }}
      is_prerelease: ${{ steps.compute.outputs.is_prerelease }}
      firebase_groups: ${{ steps.compute.outputs.firebase_groups }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: compute
        run: |
          set -euo pipefail

          GA_PAT='^v[0-9]+\.[0-9]+\.[0-9]+$'
          STAGE_PAT='^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)$'

          # --- Versioning model ---------------------------------------------
          # Stage tags (v1.3.0-beta, v1.3.0-rc) and the GA tag (v1.3.0) are
          # stage transition markers. Artifact versions are computed:
          #   <target>-<stage>.<N>      e.g. 1.3.0-beta.4
          # where <stage> is the most recent stage tag's suffix in HEAD's
          # ancestry (alpha if none), and N resets at each stage boundary:
          #   alpha:   commits since LAST_STABLE
          #   beta/rc: commits since the stage tag, +1 (tagged commit is .1)
          # Conventional-commit bumps since LAST_STABLE may push <target>
          # above what the stage tag declared; if so, auto-retag at HEAD with
          # the bumped target so future runs stay consistent.
          # versionCode (pubspec build number) = github.run_number — globally
          # monotonic, decoupled from version name arithmetic.
          # ------------------------------------------------------------------

          HEAD_TAGS=$(git tag --points-at HEAD)
          HEAD_GA=$(echo "$HEAD_TAGS" | grep -E "$GA_PAT" | sort -V | tail -1 || true)
          HEAD_STAGE_TAG=$(echo "$HEAD_TAGS" | grep -E "$STAGE_PAT" | sort -V | tail -1 || true)

          # GA build: HEAD is at a v1.2.3 tag — emit it verbatim, done.
          if [ -n "$HEAD_GA" ]; then
            VERSION="${HEAD_GA#v}"
            PUBSPEC_VERSION="${VERSION}+${{ github.run_number }}"
            {
              echo "version=${VERSION}"
              echo "pubspec_version=${PUBSPEC_VERSION}"
              echo "is_release=true"
              echo "is_prerelease=false"
              echo "target_changed=false"
              # GA fans out to every Firebase channel; testers don't get stuck
              # on stale pre-releases when stable ships.
              echo "firebase_groups=canary,beta,rc"
            } >> "$GITHUB_OUTPUT"
            echo "Computed: ${VERSION} (GA)"
            exit 0
          fi

          LAST_STABLE=$(git tag --list 'v*' | grep -E "$GA_PAT" | sort -V | tail -1 || true)

          # Compute target version from conventional commits since LAST_STABLE.
          if [ -z "$LAST_STABLE" ]; then
            BASE="0.0.0"
            LOG_RANGE="HEAD"
          else
            BASE="${LAST_STABLE#v}"
            LOG_RANGE="${LAST_STABLE}..HEAD"
          fi

          BUMP="patch"
          # NUL-delimit per commit (-z) so each $msg holds one full message.
          # The subject-anchored regexes must only see the subject line —
          # otherwise a revert/quoted body line starting with `feat:` or
          # `fix!:` would falsely trigger a bump. BREAKING CHANGE is a
          # footer convention, so we scan the whole message for it.
          while IFS= read -r -d '' msg; do
            [ -z "$msg" ] && continue
            subject="${msg%%$'\n'*}"
            if printf '%s' "$subject" | grep -qE '^[a-z]+(\(.+\))?!:' \
               || printf '%s' "$msg" | grep -q 'BREAKING CHANGE'; then
              BUMP="major"; break
            elif printf '%s' "$subject" | grep -qE '^feat(\(.+\))?:'; then
              [ "$BUMP" != "major" ] && BUMP="minor"
            fi
          done < <(git log -z "$LOG_RANGE" --format="%B" 2>/dev/null || true)

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          COMPUTED_TARGET="${MAJOR}.${MINOR}.${PATCH}"

          # Find the most recent stage tag in HEAD's ancestry (rc beats beta
          # by recency, not by name — most recent ancestor wins).
          STAGE_TAG=$(git describe --tags --abbrev=0 \
                        --match 'v[0-9]*.[0-9]*.[0-9]*-beta' \
                        --match 'v[0-9]*.[0-9]*.[0-9]*-rc' \
                        HEAD 2>/dev/null || true)

          # Discard stage tags from an already-GA'd cycle: after v1.2.0 ships,
          # v1.2.0-rc / v1.2.0-beta remain in HEAD's ancestry but the next
          # cycle should start fresh as alpha, not inherit the prior rc.
          if [ -n "$STAGE_TAG" ] && [ -n "$LAST_STABLE" ] \
             && git merge-base --is-ancestor "$STAGE_TAG" "$LAST_STABLE"; then
            STAGE_TAG=""
          fi

          TARGET_CHANGED="false"
          if [ -n "$STAGE_TAG" ]; then
            STAGE="${STAGE_TAG##*-}"                        # beta | rc
            TAG_TARGET="${STAGE_TAG#v}"; TAG_TARGET="${TAG_TARGET%-*}"

            # Pick the higher of tag's declared target and computed target.
            HIGHER=$(printf '%s\n%s\n' "$TAG_TARGET" "$COMPUTED_TARGET" | sort -V | tail -1)
            if [ "$HIGHER" = "$COMPUTED_TARGET" ] && [ "$TAG_TARGET" != "$COMPUTED_TARGET" ]; then
              TARGET="$COMPUTED_TARGET"
              TARGET_CHANGED="true"
              # Anticipate the auto-retag: N=1 so this build matches what
              # future runs will compute once v${TARGET}-${STAGE} exists.
              N=1
            else
              TARGET="$TAG_TARGET"
              DIST=$(git rev-list --count "${STAGE_TAG}..HEAD")
              N=$((DIST + 1))
            fi
          else
            STAGE="alpha"
            TARGET="$COMPUTED_TARGET"
            if [ -z "$LAST_STABLE" ]; then
              N=$(git rev-list --count HEAD)
            else
              N=$(git rev-list --count "${LAST_STABLE}..HEAD")
            fi
          fi

          VERSION="${TARGET}-${STAGE}.${N}"
          PUBSPEC_VERSION="${VERSION}+${{ github.run_number }}"

          # A build is a "release" (gets a GitHub Release entry) when HEAD
          # carries a stage tag that *matches* the computed target — i.e.
          # the tag genuinely names this artifact. If target_changed=true
          # (a feat!/BREAKING bumped past the tag's declared version), the
          # tag is mislabelled for this build, so suppress the release. The
          # subsequent auto-retag creates the correctly-named tag for future
          # runs to find via git describe.
          EXPECTED_STAGE_TAG="v${TARGET}-${STAGE}"
          if [ -n "$HEAD_STAGE_TAG" ] && [ "$HEAD_STAGE_TAG" = "$EXPECTED_STAGE_TAG" ]; then
            IS_RELEASE="true"
          else
            IS_RELEASE="false"
          fi

          # Firebase channel fan-out: each stage ships to its own channel and
          # every less-restrictive one. Internal testers (canary) see every
          # build; investors/focus groups (beta) skip alphas; FOMO early
          # adopters (rc) skip alphas and betas.
          case "$STAGE" in
            alpha) FIREBASE_GROUPS="canary" ;;
            beta)  FIREBASE_GROUPS="canary,beta" ;;
            rc)    FIREBASE_GROUPS="canary,beta,rc" ;;
          esac

          {
            echo "version=${VERSION}"
            echo "pubspec_version=${PUBSPEC_VERSION}"
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=true"
            echo "target=${TARGET}"
            echo "stage=${STAGE}"
            echo "target_changed=${TARGET_CHANGED}"
            echo "firebase_groups=${FIREBASE_GROUPS}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: ${VERSION} (stage=${STAGE}, groups=${FIREBASE_GROUPS}, target_changed=${TARGET_CHANGED}, release=${IS_RELEASE})"

      - name: Auto-retag when conventional commits bump target past stage tag
        if: steps.compute.outputs.target_changed == 'true'
        env:
          NEW_TARGET: ${{ steps.compute.outputs.target }}
          STAGE: ${{ steps.compute.outputs.stage }}
        run: |
          set -euo pipefail
          NEW_TAG="v${NEW_TARGET}-${STAGE}"
          if git rev-parse "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            echo "Tag ${NEW_TAG} already exists; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$NEW_TAG" -m "Auto-retag: conventional commits bumped target to ${NEW_TARGET}" HEAD
          # A concurrent run may have created the same tag between the
          # local rev-parse check above and this push — accept that as
          # success rather than failing the workflow.
          if git push origin "$NEW_TAG"; then
            echo "Pushed ${NEW_TAG} at $(git rev-parse --short HEAD)"
          else
            git fetch --tags origin
            if git rev-parse "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
              echo "Tag ${NEW_TAG} was created by a concurrent run; nothing to do."
            else
              echo "::error::Failed to push ${NEW_TAG} and it does not exist on remote"
              exit 1
            fi
          fi

  build-android:
    name: Build Android
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Stamp version into pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.pubspec_version }}/" pubspec.yaml

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --flavor production
      - run: flutter build appbundle --release --flavor production

      - uses: actions/upload-artifact@v7
        with:
          name: android-artifacts
          path: |
            app/build/app/outputs/flutter-apk/app-production-release.apk
            app/build/app/outputs/bundle/release/app-production-release.aab

  distribute-android:
    name: Distribute Android (Firebase)
    needs: [version, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-artifacts
          path: artifacts/android

      - name: Compose release notes
        id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          printf 'notes=%s\n' "${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Locate APK
        id: find_apk
        run: |
          set -euo pipefail
          # upload-artifact v4+ strips the least common ancestor of the
          # uploaded paths, so the APK lands under artifacts/android/ at a
          # shorter path than its source. Locate it rather than hardcoding.
          APK=$(find artifacts/android -type f -name 'app-production-release.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Could not find app-production-release.apk under artifacts/android"
            find artifacts/android -type f
            exit 1
          fi
          echo "path=${APK}" >> "$GITHUB_OUTPUT"

      - uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_PROD }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ needs.version.outputs.firebase_groups }}
          file: ${{ steps.find_apk.outputs.path }}
          releaseNotes: ${{ steps.notes.outputs.notes }}

  build-seeker:
    name: Build Seeker (SWS)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Stamp version into pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.pubspec_version }}/" pubspec.yaml

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run build_runner build --delete-conflicting-outputs
      # Seeker targets the Solana dApp Store, which distributes APKs (not AABs)
      # and expects Sign-In With Solana as the identity mechanism. Reuse the
      # production flavor and flip the auth mode at compile time.
      - run: >-
          flutter build apk --release --flavor production
          --dart-define=JEEVES_AUTH_MODE=sws

      - name: Rename APK for seeker variant
        run: |
          mv build/app/outputs/flutter-apk/app-production-release.apk \
             build/app/outputs/flutter-apk/app-production-seeker-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: seeker-artifact
          path: app/build/app/outputs/flutter-apk/app-production-seeker-release.apk

  build-web:
    name: Build Web
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.fvmrc
          channel: stable
          cache: true

      - name: Stamp version into pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.pubspec_version }}/" pubspec.yaml

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release

      - name: Archive web build
        run: tar -czf "../jeeves-web-${{ needs.version.outputs.version }}.tar.gz" web/
        working-directory: app/build

      - uses: actions/upload-artifact@v7
        with:
          name: web-artifact
          path: app/jeeves-web-${{ needs.version.outputs.version }}.tar.gz

  publish:
    name: Publish Release
    needs: [version, build-android, build-seeker, build-web]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-artifacts
          path: artifacts/android

      - uses: actions/download-artifact@v8
        with:
          name: seeker-artifact
          path: artifacts/seeker

      - uses: actions/download-artifact@v8
        with:
          name: web-artifact
          path: artifacts/web

      - name: Rename artifacts with version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # upload-artifact v4+ strips the least common ancestor of uploaded
          # paths, so the android APK/AAB don't sit at artifacts/android/ root
          # — they're under flutter-apk/ and bundle/release/. Locate them
          # rather than hardcoding so renames work regardless of layout.
          APK=$(find artifacts/android -type f -name 'app-production-release.apk' | head -1)
          AAB=$(find artifacts/android -type f -name 'app-production-release.aab' | head -1)
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "::error::Missing android artifacts under artifacts/android"
            find artifacts/android -type f
            exit 1
          fi
          mv "$APK" "artifacts/android/jeeves-${VERSION}.apk"
          mv "$AAB" "artifacts/android/jeeves-${VERSION}.aab"
          mv artifacts/seeker/app-production-seeker-release.apk \
            "artifacts/seeker/jeeves-seeker-${VERSION}.apk"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ needs.version.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Jeeves ${{ needs.version.outputs.version }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "artifacts/android/jeeves-${{ needs.version.outputs.version }}.apk" \
            "artifacts/android/jeeves-${{ needs.version.outputs.version }}.aab" \
            "artifacts/seeker/jeeves-seeker-${{ needs.version.outputs.version }}.apk" \
            "artifacts/web/jeeves-web-${{ needs.version.outputs.version }}.tar.gz"
