# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
#   - Weekly cadence (Monday) so fresh PRs land at the start of the work week.
#   - Minor + patch updates per ecosystem are bundled into a single grouped PR
#     to minimize review churn; major versions still open as individual PRs.
#   - Commit prefix `chore(deps)` matches the project's conventional-commit
#     style so the Flutter CI lockfile guard and other gates don't need to
#     special-case Dependabot branches.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions — keeps subosito/flutter-action, actions/checkout,
  # actions/setup-java, actions/cache, and wzieba/Firebase-Distribution fresh.
  # Dependabot updates the pinned SHA and the trailing `# v4` comment together.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]

  # ---------------------------------------------------------------------------
  # Backend — Python via uv (pyproject.toml + uv.lock).
  # Dependabot's `pip` ecosystem supports uv lockfiles.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      backend-python:
        update-types: [minor, patch]

  # ---------------------------------------------------------------------------
  # Backend container image base (backend/Dockerfile).
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      backend-docker:
        update-types: [minor, patch]

  # ---------------------------------------------------------------------------
  # Infra docker-compose services (infra/docker-compose.yml).
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      infra-compose:
        update-types: [minor, patch]

  # ---------------------------------------------------------------------------
  # Flutter app (app/pubspec.yaml).
  # The exact `flutter:` pin in pubspec.yaml's environment block makes
  # Dependabot's pub helper resolve against the same Flutter+Dart we use
  # locally and in CI, so the lockfile guard in flutter-ci.yml passes without
  # manual intervention.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      app-flutter:
        update-types: [minor, patch]
        # Keep file_picker OUT of the group. Its 12.x line is still pre-release
        # (latest 12.0.0-beta.7) and deprecates `withData`/`bytes` — used in
        # lib/screens/import_screen.dart — which `flutter analyze` treats as
        # fatal. A grouped lockfile bump pulled 12.0.0-beta.7 in and red the
        # analyze gate (closed #352); that group leak, not a missing ignore,
        # was the actual bug (the `>=12.0.0-0 <12.0.0` range ignore never
        # caught the pre-release).
        #
        # Excluded → file_picker updates individually, where Dependabot's
        # default skips pre-releases (we track stable ^11.0.0) yet still raises
        # 12.0.0 as its own PR once it ships stable. That individual PR is the
        # deliberate-migration trigger we want: it stays red until we move
        # import_screen.dart off the deprecated API, then we land both at once.
        exclude-patterns:
          - "file_picker"

  # ---------------------------------------------------------------------------
  # Android side of the Flutter app (app/android/build.gradle.kts).
  # ---------------------------------------------------------------------------
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      app-android:
        update-types: [minor, patch]
    ignore:
      # Hold Gradle on the 9.5.x line. Gradle 9.6.0 removed the internal API
      # `org.gradle.api.problems.internal.InternalProblems` that AGP 8.x
      # (com.android.application 8.11.1) relies on, so the Android Gradle Build
      # job fails to apply the plugin (see closed #350). Unblocks once we
      # migrate to AGP 9.x — drop this rule then. 9.5.x patches still flow.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.6.0"]
